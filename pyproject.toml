[project]
name = "task-manager"
version = "0.1.0"
description = "Simple Task Manager (FastAPI) with CRUD and tests"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
# удобный способ доставить dev-зависимости: `uv sync --group dev`
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]
